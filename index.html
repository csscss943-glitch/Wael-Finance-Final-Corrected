ن جنيهًا) والساندويتش (بثلاثين جنيهًا) في متجر، يختار الساندويتش، يأخذ ثلاثين جنيهًا من محفظته للدفع، ويحتفظ بالباقي في محفظته دون استخدامه حتى الأسبوع القادم."',a:'الوظائف الثلاث جميعًا موجودة: "المقارنة بالسعر، والدفع بالمال، والاحتفاظ به"'}]},{id:"l1d3",title:"المستوى الأول - الدرس الثالث",subtitle:"أشكال المال الحديث",count:5,questions:[{q:"عندما يحدث انقطاع للكهرباء ولا يمكن استخدام الهواتف وأجهزة قراءة البطاقات، أي شكل من أشكال المال يناسب هذه الحالة؟",a:"النقد (لأنه يمكن استخدامه دون كهرباء أو إنترنت)"},{q:'في دولة ما، يُنظر في المبادرات الأربع التالية. أيها أكثر ارتباطًا مباشرًا بـ "الشمول المالي"؟',a:"نشر خدمات الدفع عبر الهاتف المحمول ليتمكّن سكان الريف من التحويل والدفع بهواتفهم"},{q:'غيّرت دفع ثمن الكشري من النقد إلى المال الإلكتروني على هاتفك. أي مما يلي يصف بدقة ما "يتغيّر" وما "لا يتغيّر" مع هذا التبديل؟',a:"يتغيّر الشكل، لكن لا تتغيّر أي من وظائف المال الثلاث"},{q:"تتقلب أسعار الأصول المشفَّرة بشدة، بينما صُمِّمت CBDC لتكون مستقرة. ما السبب الأكبر لهذا الفرق؟",a:"الأصول المشفَّرة لا تملك دعمًا من بنك مركزي، بينما يُصدر ويدير CBDC البنك المركزي"},{q:'أي مما يلي يصف بدقة "شكل" المال و"وظيفته"؟',a:"حتى مع تغيّر شكل المال، الوظائف الثلاث مشتركة، لكن نقاط القوة والضعف تختلف حسب الشكل"}]},{id:"l1exam",title:"اختبار المستوى الأول",subtitle:"دور المال - 10 أسئلة",count:10,questions:[{q:"ما هو السبب الأكثر جوهرية لعدم انتشار المقايضة في المجتمع بأكمله؟",a:"لأن من الصعب أن تجد شخصًا يملك ما تريده ويريد أيضًا ما تملكه"},{q:"ما السبب الأكبر لاحتفاظ الأوراق النقدية الحديثة (النقود الإلزامية) بقيمتها مع أنها غير قابلة للاستبدال بالذهب؟",a:'لأن ضمان الحكومة وثقة المجتمع المشتركة بأن "يمكن استخدام هذا لشراء الأشياء"'},{q:"ما اسم الظاهرة التي تستمر فيها الأسعار في الارتفاع بشكل لا يمكن التحكم فيه وتكاد تختفي فيها قيمة المال؟",a:"التضخم المفرط"},{q:'كـ"كشري بـ٢٥ جنيهًا، شاورما بـ٤٠ جنيهًا"، أي وظيفة للمال تتيح لك مقارنة قيم سلع مختلفة برقم مشترك؟',a:"وحدة الحساب"},{q:'عندما يستلم شخص مالًا ويستطيع استخدامه لمشترياته القادمة، أي أن المال "يستمر في التداول"، مما يجعل الصفقات سلسة. أي وظيفة للمال هذه؟',a:"وسيلة التبادل"},{q:"شيء كان يمكن شراؤه بمائة جنيه منذ ١٠ سنوات لا يمكن شراؤه بنفس المائة جنيه اليوم. ما الذي انخفض؟",a:"القدرة الشرائية"},{q:"أي مما يلي خاصية صحيحة للمال الإلكتروني؟",a:"نظام يخزّن معلومات المال كبيانات رقمية ويستخدمها عبر بطاقة أو هاتف"},{q:'ما السبب في أن الأصول المشفَّرة (العملة الافتراضية) يُقال إنها غير مستقرة كـ"مخزن للقيمة"؟',a:"لأنها لا يُصدرها بنك مركزي، فتقلبات الأسعار كبيرة جدًا"},{q:"ما الفرق الأكبر بين CBDC (العملة الرقمية للبنك المركزي) والأصول المشفَّرة؟",a:"CBDC يُصدرها البنك المركزي ولها نفس دعم الثقة الذي تتمتع به العملة القانونية"},{q:'أي مما يلي هو السبب الأكثر ملاءمة لاعتبار "الشمول المالي" مهمًا بشكل خاص؟',a:"لتوصيل الخدمات المالية حتى لمن لا يستطيعون الحصول على حساب بنكي، مما يتيح المشاركة في النشاط الاقتصادي"}]},{id:"l2d1",title:"المستوى الثاني - الدرس الأول",subtitle:"دور التمويل - الوساطة المالية",count:5,questions:[{q:"استُخدم المال الذي أودعته في البنك كتمويل لصاحب المقهى. المودِع لا يعرف صاحب المقهى. في هذه الحالة، كيف وصل مال المودِع إليه؟",a:"جمع البنك مال المودِع وأقرض جزءًا منه لصاحب المقهى"},{q:'أي مما يلي يُعد "تمويلًا مباشرًا"؟',a:"تُصدر شركة أسهمًا أو سندات وتجمع المال مباشرة من المستثمرين دون المرور ببنك"},{q:"ما اسم النظام الذي يدعو فيه أشخاص إلى الجمهور العام عبر الإنترنت على نطاق واسع لجمع المال لأفكار أو مشاريع جديدة؟",a:"التمويل الجماعي"},{q:"لنفترض أنك تخطط لفتح محل جديد صغير بفكرة جديدة في المستقبل. عند جمع الأموال، ما هو النهج الأكثر منطقية؟",a:"حسب حجم المشروع ومرحلته، تقارن طرق جمع متعددة وتستخدم ما يناسب"},{q:"في نظام التمويل الجسري، إذا لم ينشأ أي مقابل (تكلفة) عند توفير المال أو السلع، ما رأيك سيحدث؟",a:"لن يكون لمقدّمي المال أي عائد، فلن يقدّم أحد المال، وسيتوقف النظام الجسري"}]},{id:"l2d2",title:"المستوى الثاني - الدرس الثاني",subtitle:"أنواع المؤسسات المالية وأدوارها",count:5,questions:[{q:"البنوك التجارية (البنوك العادية) تستلم ودائعنا وتُقرض المال للشركات والأفراد. فما الدور الذي تعتقد أن البنك المركزي يقوم به؟",a:"بنك يُصدر عملة الدولة، ويدعم البنوك التجارية، ويحافظ على استقرار قيمة العملة"},{q:'للبنك المركزي ثلاثة أدوار: "بنك الإصدار"، و"بنك البنوك"، و"بنك الحكومة". إذا لم يكن البنك المركزي بهذه الأدوار الثلاثة موجودًا، ما المشكلات التي تعتقد أنها ستحدث في المجتمع؟',a:"سيصبح إصدار الأوراق النقدية ودعم البنوك مستحيلًا، ولن يمكن الحفاظ على الثقة في المال في المجتمع"},{q:'أي مما يلي يطابق بدقة أدوار "البنك التجاري" و"شركة الأوراق المالية" و"شركة التأمين"؟',a:"البنك التجاري = يستلم ودائع ويُقرض الشركات، شركة الأوراق المالية = تتوسّط في الأسهم والسندات، شركة التأمين = تجمع أقساطًا وتستعد للخطر وتستثمر المال"},{q:"لو لم يكن نظام مثل التمويل متناهي الصغر موجودًا، ما التأثير الذي تعتقد أنه سيحدث على المجتمع؟",a:"الأشخاص الذين لا يستطيعون الاقتراض من البنوك لن يحصلوا على المال، وسيكون هناك أشخاص لا يستطيعون بدء مشاريع تجارية"},{q:"أي من العبارات التالية غير صحيحة؟",a:"شركات الأوراق المالية مؤسسات مالية تستلم ودائعنا وتُقرض الشركات، بنفس دور البنوك التجارية"}]},{id:"l2d3",title:"المستوى الثاني - الدرس الثالث",subtitle:"كيف يحرّك التمويل المجتمع",count:6,questions:[{q:"أُغلق مصنع كبير في مدينة بسبب متاعب في العمل، وفقد ٢٠٠ موظف وظائفهم. ما التأثير الذي تعتقد أن هذا الحدث يتركه على المحلات القريبة من المصنع؟",a:"مع تقليص تسوّق ٢٠٠ شخص، من المرجح أن تنخفض مبيعات المحلات القريبة"},{q:'أعلن عمدة مدينة معينة "هذا العام، سنقلّص ميزانية صيانة الطرق بشكل كبير ونضع ذلك المال في مدخرات المدينة". لنفترض أن صاحب محل في المدينة أصبح قلقًا. أي مما يلي هو السبب الأكثر منطقية؟',a:"الطرق المتضررة تؤخّر التوصيل وتجعل قدوم العملاء أصعب، مما يؤثر على المبيعات"},{q:'في أخبار اقتصادية لدولة، تم الإبلاغ عن "ثلاثة بنوك كبرى وقعت في مشكلات إدارية وأوقفت تقريبًا التمويل الجديد للشركات". إذا استمر هذا الوضع، ما التأثير الذي تعتقد أنه سينتشر في مجتمع تلك الدولة؟',a:"لن تبدأ مشاريع جديدة، وينخفض التوظيف والاستهلاك، وتنعكس الدورة الحميدة"},{q:'لنفترض أنك تفكّر في "طرق لتوصيل الخدمات المالية للناس الذين يعيشون في مناطق بلا فروع بنوك قريبة". بناءً على ما تعلمته، أي مما يلي هو الأكثر تفاؤلًا؟',a:"نشر الخدمات باستخدام تكنولوجيا جديدة كالدفع والتحويل عبر الهاتف الذكي"},{q:"في مجموعة جمعية، توقف عضو استلم المبلغ الإجمالي ثالثًا عن الدفعات من الشهر الرابع. ما التأثير على الأعضاء المتبقين؟",a:"المبلغ المُجمّع كل شهر ينخفض، والأعضاء اللاحقون في الترتيب يستلمون أقل"},{q:"في قرية ريفية في مصر، لا يوجد فرع بنك، ولا يستطيع السكان استلام تمويل. شخص في هذه القرية يريد فتح مخبز. ما وسيلة ممكنة لتحضير أموال بدء المشروع؟",a:"تكوين جمعية مع أصدقاء القرية واستلام مبالغ إجمالية بالتناوب"}]},{id:"l2exam",title:"اختبار المستوى الثاني",subtitle:"دور التمويل - 10 أسئلة",count:10,questions:[{q:'أي نوع من النظام هو "التمويل"؟',a:"نظام يوصّل المال من أصحاب الفائض إلى من يحتاجون إلى المال"},{q:"ما اسم النظام الذي تجمع فيه البنوك مال المودعين وتُقرضه للشركات؟",a:"التمويل غير المباشر"},{q:"ما اسم النظام الذي تُصدر فيه الشركات أسهمًا وتجمع المال مباشرة من المستثمرين؟",a:"التمويل المباشر"},{q:'من بين أدوار البنك المركزي الثلاثة ("بنك الإصدار"، و"بنك البنوك"، و"بنك الحكومة")، أي دور يدعم البنوك التجارية عندما تنقصها الأموال؟',a:"بنك البنوك"},{q:"من بين المؤسسات المالية التالية، أي منها له دور التوسّط في بيع الأسهم والسندات؟",a:"شركة الأوراق المالية"},{q:"ما السبب الصحيح لاعتبار شركات التأمين واحدة من المؤسسات المالية؟",a:"شركات التأمين تستثمر الأقساط التي تجمعها، مساهمة في حركة مال المجتمع"},{q:"ما الترتيب الصحيح للدورة الحميدة؟",a:"الأموال ← الاستثمار ← التوظيف ← الاستهلاك ← الإيرادات الضريبية"},{q:"ما كان المُحرِّك الأولي لصدمة ليمان في ٢٠٠٨؟",a:"أقرضت البنوك مبالغ كبيرة حتى لأشخاص ذوي قدرة سداد منخفضة، مما أدى إلى تخلّف واسع عن الدفع"},{q:'أي مما يلي هو الخاصية الأكثر ملاءمة لشخص في حالة "استبعاد مالي"؟',a:"لا يستطيع الحصول على حساب بنكي وهو في حالة لا تصله فيها فوائد الربط المالي"},{q:"ما الوصف الصحيح لنظام الجمعية؟",a:"نظام يجمع فيه أصدقاء موثوقون المال معًا ويتناوبون على استلام مبالغ إجمالية"}]},{id:"l3d1",title:"المستوى الثالث - الدرس الأول",subtitle:"آليات السوق وتحديد الأسعار",count:5,questions:[{q:"ارتفعت شهرة حذاء رياضي وارتفع سعره. في هذا الوقت، ما رأيك سيفعله صانع الحذاء الرياضي؟",a:"إذا استطاعوا البيع بسعر مرتفع، سيحاولون صنع وبيع أكثر"},{q:"صدرت برمجية لعبة مشهورة. بعد الإصدار مباشرة، كان العرض محدودًا، وكانت تُباع عبر الإنترنت بسعر أعلى من سعر التجزئة. لكن عندما زاد الصانع الإنتاج، انخفض السعر. أي مما يلي يصف هذا الوضع بدقة؟",a:"ازداد العرض ولحق بالطلب، فاقترب السعر من التوازن وانخفض"},{q:'من بين المشاهد التالية، أي منها كان ارتفاع سعره بسبب "تغيّر من جانب العرض"؟',a:"ارتفعت أسعار الخضروات أكثر من المعتاد لأن الأمطار الغزيرة أضرّت بالمحاصيل"},{q:'أي مما يلي "أقرب إلى سوق احتكار"؟',a:"شركة واحدة فقط تزوّد المياه في منطقة، ويجب على السكان استخدام تلك الشركة"},{q:"في الشتاء، جاءت موجة برد قارس شديدة وارتفعت أسعار الغاز للتدفئة بشدة. لكن عدد الأشخاص الذين يستخدمون الغاز لم ينخفض تقريبًا. أي مما يلي يصف هذا الوضع بدقة؟",a:"موجة البرد جعلت العرض غير قادر على اللحاق، فارتفعت الأسعار. استمر الناس في استخدام الغاز لأنه ضروري للحياة اليومية"}]},{id:"l3d2",title:"المستوى الثالث - الدرس الثاني",subtitle:"المؤشرات الاقتصادية",count:5,questions:[{q:'أي مما يلي من الأخبار عن "مؤشر أسعار المستهلك"؟',a:'"ارتفعت أسعار منتجات الحياة اليومية بنسبة ٧% عن العام الماضي"'},{q:"إذا أردت معرفة ما إذا كان هناك تضخم، فما الذي تعتقد أنه يجب أن تنظر إليه؟",a:"تتبّع أسعار منتجات حياة يومية كثيرة معًا وتحقّق مما إذا ارتفعت بشكل عام"},{q:"في دولة، بدأت مصانع وشركات جديدة كثيرة في الظهور، وازدادت فرص العمل. ما رأيك يحدث لمعدل البطالة في هذه الدولة؟",a:"مع مصانع وشركات أكثر وأماكن عمل أكثر، ينخفض معدل البطالة"},{q:'دخل مصر من "قناة السويس" يقع تحت أي مما يلي؟',a:"دخل من تقديم خدمات عبور القناة لسفن أجنبية، مُضمَّن في ميزان الحساب الجاري"},{q:'أُعلنت في إحدى الدول الأرقام التالية: "معدل النمو الاقتصادي موجب (الاقتصاد ينمو)"، "معدل التضخم معتدل (الأسعار مستقرة)"، "معدل البطالة مرتفع (الوظائف صعبة الإيجاد)". أي مما يلي يقرأ اقتصاد هذه الدولة بدقة؟',a:"الاقتصاد ينمو، لكن معدل من لا يجدون عملًا رغم البحث مرتفع"}]},{id:"l3d3",title:"المستوى الثالث - الدرس الثالث",subtitle:"النظم الاقتصادية",count:5,questions:[{q:"حادثة تعطل السفن في قناة السويس قد تكون مرتبطة بعدم وصول حذائك الرياضي. لماذا تعتقد أن ذلك يحدث؟",a:"ربما كانت الأحذية الرياضية محمولة على سفينة تعبر قناة السويس"},{q:"عند بدء مشروع تجاري تريده، أي من الدول الأربع التالية ستتيح لك بدء وإدارة مشروع تجاري بأكبر حرية؟",a:"دولة يستطيع فيها أي شخص فتح محل، وتقرر ماذا تبيع وبأي سعر بمراقبة المحلات والعملاء المحيطين"},{q:"عندما تتراجع الأحوال الاقتصادية أو الأسعار، بأي وسيلة يستطيع البنك المركزي (البنك المركزي المصري) الاستجابة؟",a:"ضبط مقدار المال المتداول في السوق لتسهيل تحرّك المال"},{q:"في دولة، ارتفع معدل البطالة بشدة، وفي الوقت نفسه، معدل التضخم يرتفع أيضًا. كيف تعتقد أن الحكومة والبنك المركزي يتصرفان؟",a:"تزيد الحكومة الأعمال العامة، ويشدّد البنك المركزي مقدار المال في السوق"},{q:"بسبب اضطراب الخدمات اللوجستية العالمية، انخفضت حركة قناة السويس، وارتفعت أسعار السلع المستوردة في مصر. نتيجة لذلك، ارتفع مؤشر أسعار المستهلك بشدة وبدأ الاستهلاك المحلي في الانخفاض. أي مما يلي يفسّر هذا الوضع بأفضل شكل؟",a:"بما أن مؤشر أسعار المستهلك المحلي ارتفع بسبب اضطراب الخدمات اللوجستية، يحتاج البنك المركزي إلى الاستجابة بالسياسة النقدية"}]},{id:"l3exam",title:"اختبار المستوى الثالث",subtitle:"البنية الأساسية للاقتصاد - 10 أسئلة",count:10,questions:[{q:"طُرح إصدار جديد من سلعة رياضية مشهورة للبيع. بعد الإصدار مباشرة، أراد كثير من الناس الشراء واستمر النقص. في هذا الوقت، كيف تعتقد أن سعر هذا المنتج سيتحرك؟",a:"مع وجود كثير من الناس الذين يريدون الشراء، من المرجح أن يرتفع السعر"},{q:"من بين المشاهد الأربعة التالية، أيها أقرب إلى حالة سوق احتكار؟",a:"في منطقة، شركة واحدة فقط تزوّد المياه ويجب على السكان استخدامها"},{q:"من بين التالية، أيها يُعتبَر ذا مرونة سعر صغيرة (الطلب لا يتغيّر تقريبًا عندما يتغيّر السعر)؟",a:"دواء مضاد للحمى مهم تتناوله عندما تكون مصابًا بحمى"},{q:"كان الناتج المحلي الإجمالي لدولة العام الماضي ١٠٠، لكن الناتج المحلي الإجمالي هذا العام ١٠٣. أي مما يلي صحيح بخصوص معدل النمو الاقتصادي لهذه الدولة؟",a:"معدل النمو الاقتصادي +٣%، ينمو"},{q:"بخصوص الناتج المحلي الإجمالي ومؤشر أسعار المستهلك، أي توليفة صحيحة؟",a:"الناتج المحلي الإجمالي يُظهر إجمالي إنتاج الدولة، ومؤشر أسعار المستهلك يُظهر تغيّرات الأسعار"},{q:"في دولة، أُغلقت مصانع كثيرة وتم تسري
